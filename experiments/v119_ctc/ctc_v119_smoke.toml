# v119 — smoke test de las palancas data-oriented (filtro de calidad +
# augmentation) sobre datos reales, subconjunto chico y 2 épocas. Throwaway:
# solo para confirmar que no crashea y que el conteo de batches/época refleja
# el ×5 esperado de augmentation, antes de relanzar A1 completo
# (`ctc_v119.toml`).
[experiment]
name  = "ctc_v119_smoke"
phase = "ctc"
seed  = 23

[model]
use_motion_stream = false
gcn_channels       = [32, 64, 128]
hidden_size        = 256
lstm_layers        = 2

[data]
primary_datasets      = ["dataset2"]
n_keypoints           = 111
train_ratio           = 0.8
text_group             = "text_ctx"
max_samples            = 100
min_frames             = 16
filter_invalid_labels  = true
data_augmentation      = true

[loss]
lambda_u = 0.1
lambda_p = 0.1

[training]
model_version           = 119
run_id                  = 50
epochs                  = 2
batch_size              = 16
learning_rate           = 4e-4
weight_decay            = 1e-4
warmup_epochs           = 2
lr_decay_epochs         = [20, 35]
max_frames              = 1024
checkpoint_interval     = 10
early_stopping_patience = 25
