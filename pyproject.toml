[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mslm"
version = "0.2.0-dev"
description = "Multi-Stage Learning Model for Sign Language"
authors = [
  { name = "Christian Velasquez" },
  { name = "Giorgio Mancusi" },
  { name = "Rody Vilchez" },
]
license = { text = "CC-BY-4.0" }
requires-python = ">=3.11.11"
dependencies = [
  "torch",
  "torchtune",
  "torchao<0.8.0",
  "numpy",
  "tqdm",
  "optuna",
  "pandas",
  "h5py",
  "nvtx",
  "sacrebleu",
  "grpcio",
  "protobuf",
  "transformers>=4.43.0",
  "tokenizers>=0.19.0",
  "opencv-python-headless",
  "pillow",
]

[project.optional-dependencies]
dev = [
  "poethepoet>=0.24.1",
  "pytest>=8.0.0",
]
gpu = [
  "unsloth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.poe.tasks]
[tool.poe.tasks.test]
cmd = "pytest"
env = { PYTHONPATH = "." }

[tool.poe.tasks.animate]
cmd = "python scripts/docs/make_imitator_animation.py"
env = { PYTHONPATH = "." }

[tool.poe.tasks.selftest]
cmd = "python scripts/docs/make_imitator_animation.py --selftest"
env = { PYTHONPATH = "." }

[tool.poe.tasks.train]
cmd = "python scripts/train/train.py --epochs 100 --batch_size 64 --batch_sample 4"
env = { PYTHONPATH = "." }

[tool.poe.tasks.train_temporal_v126]
cmd = "python scripts/train/train_temporal_v126.py"
env = { PYTHONPATH = "." }

[tool.poe.tasks.train_isolated]
cmd = "python scripts/train/train_isolated_staged.py"
env = { PYTHONPATH = "." }

[tool.poe.tasks.embed]
cmd = "python src/data_proc/main.py"
env = { PYTHONPATH = "." }
